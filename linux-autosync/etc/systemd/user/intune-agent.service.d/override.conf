# Drop-in override for intune-agent.service — the fix that makes background sync work.
#
# Two independent STATE_DIRECTORY failure modes exist, depending on the client build:
#   1. systemd cannot provision ~/.local/state for a *user* unit -> the agent dies in
#      status=238/STATE_DIRECTORY *before* exec, doing nothing.
#   2. The agent starts but reads its registration from the empty $STATE_DIRECTORY
#      (~/.local/state/intune) instead of ~/.config/intune/registration.toml, and logs
#      "Cannot checkin with Intune: Cannot checkin before a user logs in" on every tick.
#
# Clearing StateDirectory= handles (1) — the directive itself must go, not just the env
# var, because the failure happens in systemd's preparation phase, before ExecStart.
# The `env -u STATE_DIRECTORY` on the relaunched binary handles (2).
#
# Run `systemctl --user daemon-reload` after installing this file.
[Service]
StateDirectory=
ExecStart=
ExecStart=/usr/bin/env -u STATE_DIRECTORY /opt/microsoft/intune/bin/intune-agent
